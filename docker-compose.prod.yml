version: "3.8"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: charisma-landing-app
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    depends_on:
      mongo:
        condition: service_healthy
    restart: always
