version: "3.8"
services:
  app:
    build: .
    container_name: charisma-landing-app
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    # depends_on:
    #   mongo:
    #     condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    # networks:
      # - app-network
    network_mode: host
    user: "1001:1001"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

